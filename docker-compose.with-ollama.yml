version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: safe-qdrant-ollama
    ports:
      - "8333:6333"
      - "8334:6334"
    volumes:
      - safe_qdrant_ollama_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - safe-network

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: safe-ollama
    pull_policy: always
    ports:
      - "13434:11434"
    volumes:
      - safe_ollama_storage:/root/.ollama
    restart: unless-stopped
    networks:
      - safe-network
    runtime: nvidia
    environment:
    - CUDA_VISIBLE_DEVICES=0,1
    - OLLAMA_KEEP_ALIVE=-1
    - OLLAMA_CONTEXT_LENGTH=32768
      
    # Uncomment the following lines if you have an NVIDIA GPU, error ocured!!
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


    # entrypoint: ["/bin/sh","-lc"]   # << override the default ENTRYPOINT
    # command: |
    #   ollama serve &
    #   # wait for daemon readiness
    #   until ollama list >/dev/null 2>&1; do sleep 1; done
    #   # pull your models (add more lines if needed)
    #   ollama pull llgpt-oss
    #   # keep container alive
    #   wait
    # healthcheck:
    #   test: ["CMD", "ollama", "list"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10

  # SAFE LLM Service (with Ollama)
  safe-llm:
    # Staging image name — distinct from GANNDALF/prod stacks on the GPU server
    image: safe-llm:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safe-llm-ollama
    ports:
      - "9102:8002"
    volumes:
      # Mount data folder for documents and metadata
      - ./data:/app/data
      # Mount source code for development (hot reload)
      - ./src:/app/src
      - ./main.py:/app/main.py
    environment:
      # Service configuration
      - SERVICE_PORT=8002
      - LOG_LEVEL=INFO

      # Data folder
      - DATA_FOLDER=/app/data

      # Qdrant configuration
      - QDRANT_HOST=safe-qdrant-ollama
      - QDRANT_PORT=6333
      - COLLECTION_NAME=safe_scenarios
      - EMBEDDING_DIM=384

      # Storage
      - METADATA_DB_PATH=/app/data/scenario_metadata.db

      # Embedding configuration
      - EMBEDDING_PROVIDER=sentence_transformer
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cpu
      - EMBEDDING_BATCH_SIZE=32

      # Document processing
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNK_SIZE=2000

      # Retrieval
      - DEFAULT_TOP_K=5
      - MAX_TOP_K=20
      - RETRIEVAL_ALPHA=0.7

      # LLM configuration (pointing to Ollama service)
      - LLM_API_URL=http://safe-ollama:11434/v1/chat/completions
      - LLM_MODEL=gpt-oss
      - LLM_TEMPERATURE=0.7
      - LLM_SEED=42
      - LLM_STREAM=false
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped
    networks:
      - safe-network

volumes:
  safe_qdrant_ollama_storage:
    driver: local
  safe_ollama_storage:
    driver: local

networks:
  safe-network:
    driver: bridge
