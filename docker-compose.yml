version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: safe-qdrant
    ports:
      - "9333:6333"
      - "9334:6334"
    volumes:
      - safe_qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - safe-network

  # SAFE LLM Service
  safe-llm:
    # Staging image name — distinct from GANNDALF/prod stacks on the GPU server
    image: safe-llm:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safe-llm
    ports:
      - "9002:8002"
    volumes:
      # Mount data folder for documents and metadata
      - ./data:/app/data
      # Mount source code for development (hot reload)
      - ./src:/app/src
      - ./main.py:/app/main.py
    environment:
      # Service configuration
      - SERVICE_PORT=8002
      - LOG_LEVEL=INFO

      # Data folder
      - DATA_FOLDER=/app/data

      # Qdrant configuration
      - QDRANT_HOST=safe-qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=safe_scenarios
      - EMBEDDING_DIM=384

      # Storage
      - METADATA_DB_PATH=/app/data/scenario_metadata.db

      # Embedding configuration
      - EMBEDDING_PROVIDER=sentence_transformer
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cpu
      - EMBEDDING_BATCH_SIZE=32

      # Document processing
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNK_SIZE=2000

      # Retrieval
      - DEFAULT_TOP_K=5
      - MAX_TOP_K=20
      - RETRIEVAL_ALPHA=0.7

      # LLM configuration — use SAFE gap-enrichment Ollama (:11435).
      # Host :11434 model chat:gpt-oss is broken (GGUF tensor overflow).
      - LLM_API_URL=http://10.240.138.254:11435/v1/chat/completions
      - LLM_MODEL=gpt-oss:20b
      - LLM_TEMPERATURE=0.7
      - LLM_SEED=42
      - LLM_STREAM=false
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - safe-network
    # Use host network mode if you need to access LLM on host machine
    # network_mode: "host"  # Uncomment if LLM is on host

volumes:
  safe_qdrant_storage:
    driver: local

networks:
  safe-network:
    driver: bridge
